<!-- Cardápio. Campos: titulo, itens [{emoji,nome,desc,preco}], tema -->
<html><head><meta charset="utf-8"><style>{{css}}
body{zoom:{{escala}};width:calc({{w}}px / {{escala}});height:calc({{h}}px / {{escala}})}
body{padding:100px 0 70px;display:flex;flex-direction:column}.marca{position:static;margin-top:auto}h1{margin-top:auto}
h1{font-size:110px;text-align:center}
.lista{margin:36px 80px 30px;display:flex;flex-direction:column;gap:18px}
.item{display:flex;align-items:center;gap:28px;background:var(--acc);border-radius:28px;padding:12px 30px;border:5px solid var(--ink);box-shadow:9px 9px 0 var(--ink)}
.item .emoji{font-size:64px}
.item b{font-family:'{{fonteTitulo}}';font-weight:700;font-size:44px;display:block;line-height:1.1}
.item small{font-size:26px;opacity:.75}
.item .preco{margin-left:auto;font-family:'{{fonteTitulo}}';font-weight:700;font-size:44px;white-space:nowrap}
</style></head><body>
<div class="zigue topo"></div>
<h1 class="titulo">{{titulo}}</h1>
<div class="lista">{{itensHtml}}</div>
<div class="marca">{{marca}}</div>
</body></html>
